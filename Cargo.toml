[workspace]
resolver = "3"
members = ["crates/orm", "crates/macros", "crates/tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Only the latest stable toolchain is supported; older compilers are not tested.
rust-version = "1.99"
authors = ["Yucked"]
description = "A pure Rust ORM for SurrealDB."

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
inefficient_to_string = "deny"
match_wildcard_for_single_variants = "deny"
redundant_closure_for_method_calls = "deny"

[workspace.dependencies]
umbriel = { path = "crates/orm" }
umbriel-macros = { path = "crates/macros" }

# Engines, transports, TLS and scripting are opted into through `umbriel` features.
surrealdb = { version = "3.3.4", default-features = false }
# SurrealDB's internal parser (no SemVer guarantee); keep the same requirement as `surrealdb`.
surrealdb-syn = "3.3.4"
# The SDK's value types, named by the macros when emitting `Kind`s; same requirement as `surrealdb`.
surrealdb-types = "3.3.4"

syn = { version = "3.0.7", features = ["full", "extra-traits", "fold", "visit", "visit-mut"] }
quote = "1.0.47"
darling = "0.24.1"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
nom = "8.0.0"
# The casing the SDK's `SurrealValue` derive applies to `rename_all`; the macros must match it.
heck = "0.5.0"
strum = "0.28.0"
strum_macros = "0.28.0"
regex = "1.13.1"
paste = "1.0.15"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = "1.28.0"
tokio = "1.53.2"
sha2 = "0.11.0"
typed-builder = "0.23.2"
rand = "0.10.3"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
log = "0.4.34"
pretty_env_logger = "0.5.0"
# Must match the SDK's `geo` (geometry values are exchanged with `surrealdb::types`); 0.33 conflicts.
geo = { version = "0.32", features = ["use-serde"] }
inquire = "0.9.4"
insta = "1.49.0"
pretty_assertions = "1.4.1"
test-case = "3.4.0"
trybuild = "1.0.122"

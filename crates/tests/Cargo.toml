[package]
name = "umbriel-tests"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
publish = false

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
# Every database test runs on a developer-started server: WebSocket for most, HTTP for the
# transport scenarios in `server.rs`. No embedded engine is enabled.
umbriel = { workspace = true, default-features = false, features = [
    "migrations",
    "parse",
    "protocol-http",
    "protocol-ws",
    "test-support",
] }
# The harness bounds every network wait (`time`), removes each test database on a runtime of its
# own (`rt`), and defines the test namespace once (`sync`).
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
# Test database names (`umbriel_test_<uuid>`).
uuid = { workspace = true, features = ["v4"] }
surrealdb = { workspace = true }
serde_json = { workspace = true }
# Consumes live subscriptions and result streams (`StreamExt`).
futures = { workspace = true }
geo = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
# Checks rendered SurrealQL against SurrealDB 3's own parser (`assert_sql`).
surrealdb-syn = { workspace = true }
pretty_assertions = { workspace = true }

[dev-dependencies]
# Parses the migration CLI's arguments in-process (`Migrator` is a `clap::Parser`).
clap = { workspace = true }
trybuild = { workspace = true }
rand = { workspace = true }

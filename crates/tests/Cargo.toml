[package]
name = "umbriel-tests"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
publish = false

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
# The remote transports serve the server-backed tests in `tests/server.rs`.
umbriel = { workspace = true, default-features = false, features = [
    "kv-mem",
    "migrations",
    "parse",
    "protocol-http",
    "protocol-ws",
    "test-support",
] }
surrealdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
geo = { workspace = true }
chrono = { workspace = true }
typed-builder = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
# Checks rendered SurrealQL against SurrealDB 3's own parser (`assert_sql`).
surrealdb-syn = { workspace = true }
pretty_assertions = { workspace = true }

[dev-dependencies]
# Parses the migration CLI's arguments in-process (`Migrator` is a `clap::Parser`).
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
trybuild = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
test-case = { workspace = true }
# Macro expansion modules compiled into `macros_*` test targets via `#[path]`.
proc-macro2 = { workspace = true }
proc-macro-crate = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
darling = { workspace = true }
heck = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
paste = { workspace = true }
nom = { workspace = true }
